services:
  - type: web
    name: sawari-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sawari-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: sawari-db
    plan: free
    databaseName: sawari
    user: sawari
