name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sawari
          POSTGRES_PASSWORD: sawari
          POSTGRES_DB: sawari_test
        ports: ["25432:5432"]
        options: >-
          --health-cmd "pg_isready -U sawari" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew :app:lintLiteDebug
      - name: Unit tests (ViewModels, MockWebServer, Robolectric Room)
        run: ./gradlew :app:testLiteDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew :app:assembleLiteDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sawari-debug-apk
          path: app/build/outputs/apk/lite/debug/app-lite-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/lint-results-liteDebug.html
            app/build/reports/tests/testLiteDebugUnitTest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sawari-debug-apk
      - name: Publish APK as a release asset
        uses: softprops/action-gh-release@v2
        with:
          files: app-lite-debug.apk
          generate_release_notes: true
